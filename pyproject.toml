[project]
name = "pyblox"
version = "0.1.1"
description = "A wrapper for interacting with Roblox APIs"
authors = [{name = "MrBaconHat"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.9.0"
]

keywords = ["roblox", "api", "wrapper", "async"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"